<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Blog post detail page.">
  <title>Post | Embodied AI Notes</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="post">
  <div class="layout post-layout">
    <aside class="left-sidebar">
      <div class="profile">
        <a class="avatar" href="./index.html" aria-label="Home">
          <span class="octicon icon-hubot avatar-icon" aria-hidden="true"></span>
          <span class="status-dot">AI</span>
        </a>
        <a class="site-title" href="./index.html">Embodied AI Notes</a>
        <p class="site-subtitle">A personal growth blog.</p>
      </div>
      <nav class="side-nav" aria-label="post navigation">
        <a href="./index.html"><span class="octicon icon-home" aria-hidden="true"></span>Home</a>
        <a href="./index.html#blog"><span class="octicon icon-book" aria-hidden="true"></span>Blog</a>
      </nav>
      <div class="left-footer">
        <button class="dark-mode" id="theme-toggle" type="button" aria-pressed="false">
          <span class="octicon icon-moon" aria-hidden="true"></span>
          Dark Mode
        </button>
      </div>
    </aside>

    <main class="main-content">
      <article class="post-card post-detail">
        <div class="post-body full">
          <a class="post-back" href="./index.html#blog"><span class="octicon icon-book" aria-hidden="true"></span>Back to blog</a>
          <span class="category" id="post-category">Post</span>
          <h1 id="post-title">Loading...</h1>
          <p class="post-summary" id="post-summary">Reading post metadata.</p>
          <div class="post-meta" id="post-meta"></div>
          <div class="markdown-body" id="post-content"></div>
        </div>
      </article>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
